name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Fails the job when a coverage threshold in vitest.config.ts is not met.
      - name: Test with coverage
        run: npm run test:coverage

      # Per-file view, so a weak module cannot hide behind a healthy total.
      - name: Per-file coverage floor
        run: npm run coverage:report -- --min 80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
